# Shared configuration served by config-server.
# Add service-specific files next to this file, for example auth-svc.yml.
app:
  config-source: native
  
spring:
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    
eduplatform:
  datasource:
    url: ${EDUPLATFORM_DB_URL:jdbc:mysql://localhost:3306/edu_platform?serverTimezone=Asia%2FHo_Chi_Minh&connectionTimeZone=Asia%2FHo_Chi_Minh}
    username: ${EDUPLATFORM_DB_USERNAME:root}
    password: ${EDUPLATFORM_DB_PASSWORD:A123456}
  password-default: A123456
